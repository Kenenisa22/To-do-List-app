<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .todo-container {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      -webkit-backdrop-filter: blur(12px); /* Safari support - prefix first */
      backdrop-filter: blur(12px); /* Standard property after prefix */
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 20, 30, 0.25),
                  inset 0 1px 2px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #0b2b3d;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      letter-spacing: -0.5px;
    }

    h1 i {
      color: #2a7faa;
      font-size: 2rem;
    }

    .input-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 2rem;
    }

    .input-section input {
      flex: 1 1 200px;
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 60px;
      background: white;
      box-shadow: 0 6px 14px rgba(0, 20, 30, 0.06);
      font-size: 1rem;
      transition: 0.2s;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .input-section input:focus {
      outline: 2px solid #2a7faa;
      outline-offset: 2px;
      box-shadow: 0 8px 18px rgba(42, 127, 170, 0.15);
    }

    .input-section button {
      background: #1e5f7e;
      border: none;
      color: white;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 16px rgba(26, 80, 110, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .input-section button:hover {
      background: #134b66;
      transform: scale(0.97);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.5);
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      margin-bottom: 1.8rem;
      font-size: 0.9rem;
      color: #1f4459;
      -webkit-backdrop-filter: blur(4px); /* Safari support - prefix first */
      backdrop-filter: blur(4px); /* Standard property after prefix */
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .stats-bar span {
      font-weight: 500;
    }

    .stats-bar i {
      margin-right: 0.3rem;
      color: #2a7faa;
    }

    .filter-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
    }

    .filter-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1f4459;
      cursor: pointer;
      transition: 0.15s;
      background: rgba(255, 255, 255, 0.3);
      -webkit-backdrop-filter: blur(4px); /* Safari support - prefix first */
      backdrop-filter: blur(4px); /* Standard property after prefix */
      border: 1px solid transparent;
    }

    .filter-btn.active {
      background: #1e5f7e;
      color: white;
      box-shadow: 0 4px 10px rgba(26, 80, 110, 0.2);
      border-color: #1e5f7e;
    }

    .filter-btn:hover:not(.active) {
      background: rgba(30, 95, 126, 0.08);
      border-color: #b6d4e3;
    }

    .task-list {
      list-style: none;
      margin: 1.2rem 0 1.8rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .task-item {
      background: white;
      padding: 0.9rem 1.2rem 0.9rem 1.5rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.02);
      transition: all 0.15s;
      animation: fadeIn 0.2s ease;
    }

    .task-item:hover {
      border-color: #c8dbe8;
      box-shadow: 0 8px 20px rgba(0, 20, 30, 0.06);
    }

    .task-item .task-text {
      flex: 1;
      font-size: 1rem;
      color: #0b2b3d;
      word-break: break-word;
      padding-right: 0.3rem;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .task-item .task-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
      margin-left: auto;
    }

    .task-actions button {
      background: transparent;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #3a5b6e;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .task-actions button:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .task-actions .edit-btn:hover {
      background: #ddeef9;
      color: #1a6283;
    }

    .task-actions .delete-btn:hover {
      background: #ffe4e4;
      color: #b33c3c;
    }

    .task-actions .complete-toggle {
      color: #2a7faa;
      font-size: 1.2rem;
    }

    .task-actions .complete-toggle:hover {
      background: #d6edf7;
    }

    .task-item.completed .complete-toggle {
      color: #1f8b4c;
    }

    .utility-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.8rem;
      justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.04);
      padding-top: 1.8rem;
    }

    /* Utility buttons wrapper - replaces inline style */
    .utility-left-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .utility-btn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0,0,0,0.04);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f4459;
      cursor: pointer;
      transition: 0.15s;
      -webkit-backdrop-filter: blur(4px); /* Safari support - prefix first */
      backdrop-filter: blur(4px); /* Standard property after prefix */
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .utility-btn:hover {
      background: white;
      border-color: #b6d4e3;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .utility-btn.danger:hover {
      background: #ffe4e4;
      border-color: #e6b3b3;
      color: #a13d3d;
    }

    .empty-message {
      text-align: center;
      color: #6d8b9c;
      padding: 2rem 0 1rem;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0.6; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .todo-container { padding: 1.5rem; }
      h1 { font-size: 1.8rem; }
      .input-section button { padding: 0.8rem 1.4rem; }
      .stats-bar { flex-direction: column; gap: 0.3rem; align-items: flex-start; }
      .task-item { flex-wrap: wrap; border-radius: 30px; padding: 0.7rem 1rem; }
      .task-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
<div class="todo-container">
  <h1><i class="fas fa-check-double"></i> My To-Do List</h1>

  <!-- input + add -->
  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a new task..." />
    <button id="addBtn"><i class="fas fa-plus"></i> Add Task</button>
  </div>

  <!-- stats -->
  <div class="stats-bar" id="statsBar">
    <span><i class="fas fa-list-ul"></i> Total: <strong id="totalCount">0</strong></span>
    <span><i class="fas fa-circle-check"></i> Completed: <strong id="completedCount">0</strong></span>
    <span><i class="fas fa-hourglass-half"></i> Pending: <strong id="pendingCount">0</strong></span>
  </div>

  <!-- filters -->
  <div class="filter-group" id="filterGroup">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <!-- task list -->
  <ul class="task-list" id="taskList"></ul>

  <!-- utilities -->
  <div class="utility-bar">
    <div class="utility-left-group">
      <button class="utility-btn" id="clearCompletedBtn"><i class="fas fa-check-double"></i> Clear completed</button>
      <button class="utility-btn danger" id="deleteAllBtn"><i class="fas fa-trash-can"></i> Delete all</button>
    </div>
    <button class="utility-btn" id="sortAlphaBtn"><i class="fas fa-arrow-up-a-z"></i> Sort A–Z</button>
  </div>
</div>

<script>
  (function(){
    // ----- STATE -----
    let tasks = [];
    let currentFilter = 'all'; // 'all', 'active', 'completed'

    // DOM refs
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const totalCount = document.getElementById('totalCount');
    const completedCount = document.getElementById('completedCount');
    const pendingCount = document.getElementById('pendingCount');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const deleteAllBtn = document.getElementById('deleteAllBtn');
    const sortAlphaBtn = document.getElementById('sortAlphaBtn');

    // ----- helper functions -----
    function generateId() {
      return Date.now() + '-' + Math.random().toString(36).substr(2, 6);
    }

    // ----- load from localStorage -----
    function loadTasks() {
      const stored = localStorage.getItem('todoTasks');
      if (stored) {
        try {
          tasks = JSON.parse(stored);
          // ensure each task has an id (migrate old)
          tasks = tasks.map(t => ({ ...t, id: t.id || generateId() }));
        } catch (e) { tasks = []; }
      } else {
        // initial demo tasks
        tasks = [
          { id: generateId(), text: 'Learn HTML', completed: false },
          { id: generateId(), text: 'Practice CSS', completed: false },
          { id: generateId(), text: 'Build Portfolio Website', completed: true },
          { id: generateId(), text: 'Learn JavaScript', completed: false },
        ];
      }
      saveTasks();
    }

    function saveTasks() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    // ----- render based on filter -----
    function render() {
      const filtered = getFilteredTasks();
      taskList.innerHTML = '';

      if (filtered.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-message';
        empty.textContent = currentFilter === 'all' ? 'No tasks yet. Add one!' :
                            currentFilter === 'active' ? 'No pending tasks 🎉' : 'No completed tasks.';
        taskList.appendChild(empty);
      } else {
        filtered.forEach(task => {
          const li = document.createElement('li');
          li.className = `task-item ${task.completed ? 'completed' : ''}`;
          li.dataset.id = task.id;

          // text span
          const textSpan = document.createElement('span');
          textSpan.className = 'task-text';
          textSpan.textContent = task.text;

          // actions container
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'task-actions';

          // complete toggle
          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'complete-toggle';
          toggleBtn.innerHTML = task.completed ? '<i class="fas fa-circle-check"></i>' : '<i class="far fa-circle"></i>';
          toggleBtn.title = task.completed ? 'Mark as pending' : 'Mark as completed';
          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleComplete(task.id);
          });

          // edit button
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn';
          editBtn.innerHTML = '<i class="fas fa-pen"></i>';
          editBtn.title = 'Edit task';
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            editTask(task.id);
          });

          // delete button
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.innerHTML = '<i class="fas fa-trash-can"></i>';
          deleteBtn.title = 'Delete task';
          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteTask(task.id);
          });

          actionsDiv.appendChild(toggleBtn);
          actionsDiv.appendChild(editBtn);
          actionsDiv.appendChild(deleteBtn);

          li.appendChild(textSpan);
          li.appendChild(actionsDiv);

          // click on whole item toggles complete (optional, but friendly)
          li.addEventListener('click', (e) => {
            // avoid if click inside actions
            if (e.target.closest('.task-actions')) return;
            toggleComplete(task.id);
          });

          taskList.appendChild(li);
        });
      }
      updateStats();
    }

    function getFilteredTasks() {
      if (currentFilter === 'all') return tasks;
      if (currentFilter === 'active') return tasks.filter(t => !t.completed);
      if (currentFilter === 'completed') return tasks.filter(t => t.completed);
      return tasks;
    }

    function updateStats() {
      const total = tasks.length;
      const comp = tasks.filter(t => t.completed).length;
      const pend = total - comp;
      totalCount.textContent = total;
      completedCount.textContent = comp;
      pendingCount.textContent = pend;
    }

    // ----- CRUD -----
    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') {
        alert('Task cannot be empty.');
        return;
      }
      // duplicate check (case-insensitive)
      const duplicate = tasks.some(t => t.text.toLowerCase() === text.toLowerCase());
      if (duplicate) {
        alert('Task already exists.');
        return;
      }
      const newTask = { id: generateId(), text, completed: false };
      tasks.push(newTask);
      saveTasks();
      render();
      taskInput.value = '';
      taskInput.focus();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    function toggleComplete(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        render();
      }
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const newText = prompt('Edit task:', task.text);
      if (newText === null) return; // cancel
      const trimmed = newText.trim();
      if (trimmed === '') {
        alert('Task cannot be empty.');
        return;
      }
      // duplicate check (ignore itself)
      const duplicate = tasks.some(t => t.id !== id && t.text.toLowerCase() === trimmed.toLowerCase());
      if (duplicate) {
        alert('Task already exists.');
        return;
      }
      task.text = trimmed;
      saveTasks();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      render();
    }

    function deleteAll() {
      if (tasks.length === 0) return;
      if (confirm('Delete all tasks?')) {
        tasks = [];
        saveTasks();
        render();
      }
    }

    function sortAlphabetically() {
      tasks.sort((a, b) => a.text.localeCompare(b.text));
      saveTasks();
      render();
    }

    // ----- filter change -----
    function setFilter(filter) {
      currentFilter = filter;
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    // ----- event listeners -----
    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTask();
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setFilter(btn.dataset.filter);
      });
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);
    deleteAllBtn.addEventListener('click', deleteAll);
    sortAlphaBtn.addEventListener('click', sortAlphabetically);

    // ----- init -----
    loadTasks();
    render();
    setFilter('all'); // ensure active filter UI

    // extra: if input empty, focus
    taskInput.focus();
  })();
</script>
</body>
</html>
