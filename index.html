<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List app</title>
  <!-- Font Awesome Icons (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="todo-container">
  <h1><i class="fas fa-check-double"></i> My To-Do List</h1>

  <!-- input + add -->
  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a new task..." />
    <button id="addBtn"><i class="fas fa-plus"></i> Add Task</button>
  </div>

  <!-- stats -->
  <div class="stats-bar" id="statsBar">
    <span><i class="fas fa-list-ul"></i> Total: <strong id="totalCount">0</strong></span>
    <span><i class="fas fa-circle-check"></i> Completed: <strong id="completedCount">0</strong></span>
    <span><i class="fas fa-hourglass-half"></i> Pending: <strong id="pendingCount">0</strong></span>
  </div>

  <!-- filters -->
  <div class="filter-group" id="filterGroup">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <!-- task list -->
  <ul class="task-list" id="taskList"></ul>

  <!-- utilities -->
  <div class="utility-bar">
    <div class="utility-left-group">
      <button class="utility-btn" id="clearCompletedBtn"><i class="fas fa-check-double"></i> Clear completed</button>
      <button class="utility-btn danger" id="deleteAllBtn"><i class="fas fa-trash-can"></i> Delete all</button>
    </div>
    <button class="utility-btn" id="sortAlphaBtn"><i class="fas fa-arrow-up-a-z"></i> Sort A–Z</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
